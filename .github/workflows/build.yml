name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the launcher
        shell: powershell
        run: .\launcher\build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: PaddockLadder
          path: dist/PaddockLadder.exe
